  <style>
/* =========================================================================
   Catarinna's Conecta — estilos
   Identidade: rosa #e51786 · amarelo #ffcf00 · fundo claro
   ========================================================================= */

:root {
  --rosa: #e51786;
  --rosa-escuro: #b80f69;
  --rosa-claro: #fde7f2;
  --rosa-suave: #fff4f9;
  --amarelo: #ffcf00;
  --amarelo-claro: #fff6cc;
  --fundo: #faf7f9;
  --card: #ffffff;
  --texto: #2a2230;
  --texto-2: #6b6170;
  --texto-3: #9a91a0;
  --linha: #efe7ec;
  --linha-forte: #e2d6de;
  --ok: #138a5b;
  --ok-claro: #e3f6ee;
  --alerta: #c25e00;
  --alerta-claro: #fff1e0;
  --erro: #c62839;
  --erro-claro: #fde8ea;
  --sombra: 0 1px 2px rgba(60, 20, 45, .05), 0 6px 18px rgba(60, 20, 45, .06);
  --sombra-forte: 0 20px 50px rgba(60, 20, 45, .18);
  --raio: 16px;
  --raio-p: 10px;
  --fonte: Candara, "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fonte-titulo: "Barlow Condensed", "Arial Narrow", Candara, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--fonte);
  font-size: 15px;
  line-height: 1.5;
  color: var(--texto);
  background: var(--fundo);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(229, 23, 134, .35); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

.skip { position: absolute; left: -999px; top: 0; background: var(--rosa); color: #fff; padding: 8px 14px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }

/* Ícones */
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle; }
.ico svg { width: 100%; height: 100%; display: block; }

/* ----------------------------- Topo ----------------------------- */
.topo {
  background: #fff;
  border-bottom: 1px solid var(--linha);
  position: sticky; top: 0; z-index: 30;
}
.topo::after {
  content: ""; display: block; height: 3px;
  background: linear-gradient(90deg, var(--rosa) 0 70%, var(--amarelo) 70% 100%);
}
.topo-inner {
  max-width: 1320px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 18px;
}
.marca {
  display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left;
}
.marca-sol { width: 64px; height: auto; }
.marca-texto { display: flex; flex-direction: column; line-height: 1.05; }
.marca-nome { font-family: var(--fonte-titulo); font-weight: 800; font-size: 26px; color: var(--rosa); letter-spacing: .2px; }
.marca-nome em { font-style: normal; color: var(--texto); font-weight: 700; }
.marca-sub { font-size: 12.5px; color: var(--texto-2); font-weight: 600; letter-spacing: .3px; }

.nav { display: flex; gap: 4px; margin-left: auto; }
.nav-btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 0; background: none; padding: 9px 14px; border-radius: 999px;
  color: var(--texto-2); font-weight: 700; font-size: 14px; position: relative;
}
.nav-btn:hover { background: var(--rosa-suave); color: var(--rosa); }
.nav-btn.ativo { background: var(--rosa-claro); color: var(--rosa-escuro); }
.nav-badge {
  background: var(--rosa); color: #fff; font-size: 11px; min-width: 20px; height: 20px; border-radius: 10px;
  display: inline-grid; place-items: center; padding: 0 6px;
}
.topo-acoes { display: flex; align-items: center; gap: 8px; position: relative; }

/* ----------------------------- Botões ----------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--linha-forte); background: #fff; color: var(--texto);
  padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
  transition: background .15s, border-color .15s, transform .05s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--rosa); color: var(--rosa); }
.btn:active { transform: translateY(1px); }
.btn-primario { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.btn-primario:hover { background: var(--rosa-escuro); border-color: var(--rosa-escuro); color: #fff; }
.btn-amarelo { background: var(--amarelo); border-color: var(--amarelo); color: #3b2b00; }
.btn-amarelo:hover { background: #f2c200; border-color: #f2c200; color: #3b2b00; }
.btn-perigo { color: var(--erro); border-color: #f2c4ca; }
.btn-perigo:hover { background: var(--erro-claro); border-color: var(--erro); color: var(--erro); }
.btn-texto { border-color: transparent; background: transparent; padding: 6px 10px; }
.btn-texto:hover { background: var(--rosa-suave); border-color: transparent; }
.btn-p { padding: 6px 12px; font-size: 13px; }
.btn-icone { padding: 8px; width: 40px; height: 40px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.menu {
  position: absolute; right: 0; top: calc(100% + 8px); background: #fff; border: 1px solid var(--linha);
  border-radius: 14px; box-shadow: var(--sombra-forte); padding: 6px; min-width: 290px; z-index: 40;
}
.menu button, .menu .menu-arquivo {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none;
  padding: 10px 12px; border-radius: 10px; text-align: left; font-weight: 600; font-size: 14px; cursor: pointer;
}
.menu button:hover, .menu .menu-arquivo:hover { background: var(--rosa-suave); color: var(--rosa-escuro); }

/* ----------------------------- Layout ----------------------------- */
.conteudo { flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: 22px 20px 40px; outline: none; }
.rodape {
  max-width: 1320px; width: 100%; margin: 0 auto; padding: 18px 20px 28px;
  display: flex; align-items: center; gap: 14px; color: var(--texto-3); font-size: 13px;
  border-top: 1px solid var(--linha);
}
.rodape p { margin: 0; }
.rodape-selo { width: 42px; height: 42px; }

.card {
  background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio);
  box-shadow: var(--sombra); padding: 18px 20px;
}
.card-titulo {
  display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
  font-family: var(--fonte-titulo); font-weight: 700; font-size: 21px; letter-spacing: .2px;
}
.card-titulo .ico { color: var(--rosa); width: 20px; height: 20px; }
.card-titulo .acao { margin-left: auto; font-family: var(--fonte); font-size: 13px; }
.sub { color: var(--texto-2); font-size: 13.5px; margin: -6px 0 12px; }

.grade { display: grid; gap: 18px; }

/* ----------------------------- Hero do painel ----------------------------- */
.hero {
  position: relative; overflow: hidden; border-radius: 22px;
  background: linear-gradient(120deg, var(--rosa) 0%, #d1127a 55%, #b80f69 100%);
  color: #fff; padding: 26px 28px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
}
.hero::before {
  content: ""; position: absolute; right: -60px; bottom: -150px; width: 380px; height: 380px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 207, 0, .55) 0 30%, rgba(255, 207, 0, 0) 31%),
              repeating-conic-gradient(from 0deg, rgba(255, 207, 0, .55) 0deg 4deg, transparent 4deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0 62%, transparent 63%);
          mask: radial-gradient(circle, #000 0 62%, transparent 63%);
  opacity: .9;
}
.hero > * { position: relative; }
.hero-saud { font-size: 14px; opacity: .9; font-weight: 600; margin: 0 0 4px; }
.hero h1 { font-family: var(--fonte-titulo); font-size: 40px; line-height: 1; margin: 0 0 8px; font-weight: 800; letter-spacing: .3px; }
.hero h1 span { color: var(--amarelo); }
.hero p { margin: 0; max-width: 640px; opacity: .95; }
.hero-acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.hero .btn { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.12); color: #fff; }
.hero .btn:hover { background: rgba(255,255,255,.22); color: #fff; border-color: #fff; }
.hero .btn-amarelo { background: var(--amarelo); color: #3b2b00; border-color: var(--amarelo); }
.hero .btn-amarelo:hover { background: #fff; color: var(--rosa-escuro); }
.hero-selo { width: 132px; height: 132px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 18px 0; }
.kpi {
  background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; box-shadow: var(--sombra);
  display: flex; flex-direction: column; gap: 2px; text-align: left; position: relative; overflow: hidden;
}
button.kpi:hover { border-color: var(--rosa); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kpi-cor, var(--rosa)); }
.kpi-rotulo { font-size: 12.5px; color: var(--texto-2); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: flex; gap: 6px; align-items: center; }
.kpi-valor { font-family: var(--fonte-titulo); font-size: 36px; font-weight: 800; line-height: 1.05; }
.kpi-det { font-size: 12.5px; color: var(--texto-3); }
.progresso { height: 6px; background: var(--linha); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.progresso > i { display: block; height: 100%; background: linear-gradient(90deg, var(--rosa), var(--amarelo)); border-radius: 6px; }

.painel-grade { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.painel-col { display: grid; gap: 18px; }

/* ----------------------------- Ano (12 meses) ----------------------------- */
.ano-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ano-topo h2 { margin: 0; font-family: var(--fonte-titulo); font-size: 24px; }
.ano-topo .ano-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--texto-2); margin: 0 0 14px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.ano { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mini {
  border: 1px solid var(--linha); border-radius: 14px; padding: 10px 10px 8px; background: #fff;
  text-align: left; transition: border-color .15s, box-shadow .15s, transform .15s; width: 100%;
  display: flex; flex-direction: column; justify-content: flex-start;
}
.mini:hover { border-color: var(--rosa); box-shadow: 0 8px 20px rgba(229, 23, 134, .12); transform: translateY(-2px); }
.mini-cab { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.mini-nome { font-family: var(--fonte-titulo); font-weight: 700; font-size: 18px; color: var(--texto); }
.mini-qtd { font-size: 11.5px; font-weight: 700; color: var(--rosa); background: var(--rosa-claro); padding: 1px 8px; border-radius: 999px; }
.mini-camp { display: flex; gap: 3px; flex-wrap: wrap; min-height: 6px; margin-bottom: 4px; }
.mini-camp i { height: 4px; flex: 1; border-radius: 4px; min-width: 18px; }
.mini-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font-size: 10.5px; text-align: center; }
.mini-grade b { color: var(--texto-3); font-weight: 700; font-size: 9.5px; }
.mini-dia { position: relative; padding: 2px 0 5px; color: var(--texto-2); border-radius: 5px; }
.mini-dia.fds { color: var(--texto-3); }
.mini-dia.tem { color: var(--texto); font-weight: 800; background: var(--rosa-suave); }
.mini-dia.hoje { outline: 2px solid var(--amarelo); }
.mini-dia .pts { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: center; gap: 1px; }
.mini-dia .pts i { width: 4px; height: 4px; border-radius: 50%; }

/* ----------------------------- Listas ----------------------------- */
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
  padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; background: var(--fundo);
  text-align: left; width: 100%;
}
button.item:hover { border-color: var(--rosa); background: #fff; }
.item-data {
  border-radius: 10px; background: #fff; border: 1px solid var(--linha); text-align: center; padding: 4px 0; line-height: 1.05;
}
.item-data b { display: block; font-family: var(--fonte-titulo); font-size: 22px; color: var(--rosa); }
.item-data small { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--texto-2); letter-spacing: .5px; }
.item-tit { font-weight: 700; line-height: 1.25; font-size: 14.5px; }
.item-meta { font-size: 12.5px; color: var(--texto-2); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; align-items: center; }
.item-dir { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.vazio { color: var(--texto-3); font-size: 14px; padding: 12px; text-align: center; background: var(--fundo); border-radius: 12px; }

.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
  padding: 2px 9px; border-radius: 999px; background: var(--tag-fundo, var(--linha)); color: var(--tag-cor, var(--texto-2));
  white-space: nowrap; line-height: 1.6;
}
.tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.tag-alta { --tag-fundo: var(--rosa-claro); --tag-cor: var(--rosa-escuro); }
.tag-media { --tag-fundo: var(--amarelo-claro); --tag-cor: #7a5a00; }
.tag-baixa { --tag-fundo: #eef1f5; --tag-cor: #55606e; }
.tag-pendente { --tag-fundo: #eef1f5; --tag-cor: #55606e; }
.tag-planejado { --tag-fundo: #e6efff; --tag-cor: #1d4ed8; }
.tag-concluido { --tag-fundo: var(--ok-claro); --tag-cor: var(--ok); }
.tag-tipo { --tag-fundo: #fff; --tag-cor: var(--texto-2); border: 1px solid var(--linha-forte); }
.tag-aviso { --tag-fundo: var(--alerta-claro); --tag-cor: var(--alerta); }
.tag-demo { --tag-fundo: #1f2937; --tag-cor: #fff; }

/* Áreas profissionais */
.areas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.area {
  border: 1px solid var(--linha); border-radius: 12px; padding: 9px 11px; background: #fff; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 2px;
}
.area:hover { border-color: var(--rosa); }
.area b { font-size: 13.5px; line-height: 1.25; }
.area span { font-size: 12px; color: var(--texto-2); }

/* Campanhas */
.campanhas { display: grid; gap: 8px; }
.campanha {
  display: flex; align-items: center; gap: 10px; border: 1px solid var(--linha); border-radius: 12px; padding: 8px 10px; background: #fff; text-align: left; width: 100%;
}
.campanha:hover { border-color: var(--rosa); }
.campanha-cor { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; text-transform: uppercase; }
.campanha div { line-height: 1.25; }
.campanha b { font-size: 13.5px; display: block; }
.campanha small { color: var(--texto-2); font-size: 12px; }

/* ----------------------------- Lembretes ----------------------------- */
.lemb { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--fundo); border: 1px solid transparent; }
.lemb:hover { border-color: var(--linha-forte); background: #fff; }
.lemb-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--rosa-claro); color: var(--rosa); font-family: var(--fonte-titulo); font-weight: 800; font-size: 15px; line-height: 1; text-align: center; }
.lemb-ico small { display: block; font-size: 9px; font-family: var(--fonte); font-weight: 700; }
.lemb.atrasado .lemb-ico { background: var(--erro-claro); color: var(--erro); }
.lemb.hoje .lemb-ico { background: var(--amarelo); color: #3b2b00; }
.lemb.feito { opacity: .55; }
.lemb.feito .lemb-acao { text-decoration: line-through; }
.lemb-acao { font-weight: 700; font-size: 14px; line-height: 1.3; }
.lemb-ev { font-size: 12.5px; color: var(--texto-2); }
.lemb-quando { font-size: 12px; color: var(--texto-3); font-weight: 600; }
.lemb-btns { display: flex; gap: 4px; }
.grupo-tit { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--texto-2); margin: 16px 0 8px; display: flex; gap: 8px; align-items: center; }
.grupo-tit:first-child { margin-top: 0; }
.grupo-tit em { font-style: normal; background: var(--linha); border-radius: 999px; padding: 0 8px; }

.resumo-lemb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.resumo-lemb > div { background: var(--fundo); border-radius: 12px; padding: 8px 10px; text-align: center; }
.resumo-lemb b { display: block; font-family: var(--fonte-titulo); font-size: 26px; line-height: 1.1; }
.resumo-lemb span { font-size: 11.5px; color: var(--texto-2); font-weight: 700; }
.resumo-lemb .r-atr b { color: var(--erro); }
.resumo-lemb .r-hoje b { color: #a07800; }
.resumo-lemb .r-prox b { color: var(--rosa); }

.notif-box { border: 1px dashed var(--linha-forte); border-radius: 14px; padding: 14px 16px; background: var(--rosa-suave); }
.notif-box h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.notif-box p { margin: 0 0 10px; font-size: 13.5px; color: var(--texto-2); }
.notif-estado { font-weight: 800; }
.notif-estado.ok { color: var(--ok); }
.notif-estado.neg { color: var(--erro); }
.notif-estado.pend { color: var(--alerta); }
.regras { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--texto-2); }
.regras li { margin: 2px 0; }

/* ----------------------------- Mês ----------------------------- */
.mes-barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.mes-titulo { font-family: var(--fonte-titulo); font-size: 32px; font-weight: 800; margin: 0; min-width: 230px; }
.mes-titulo small { color: var(--texto-3); font-weight: 700; }
.mes-nav { display: flex; gap: 4px; align-items: center; }
.filtros { display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(130px, 1fr)) auto; gap: 8px; margin-bottom: 14px; }
.campo-busca { position: relative; }
.campo-busca .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--texto-3); }
.campo-busca input { padding-left: 38px; }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--linha-forte); background: #fff; border-radius: 12px; padding: 9px 12px; font-size: 14px;
}
.input:focus { border-color: var(--rosa); outline: none; box-shadow: 0 0 0 3px rgba(229, 23, 134, .15); }
textarea.input { resize: vertical; min-height: 80px; }

.camp-mes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.camp-faixa {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px 6px 6px; border: 1px solid var(--linha);
  background: #fff; font-weight: 700; font-size: 13px;
}
.camp-faixa:hover { border-color: var(--rosa); }
.camp-faixa i { width: 22px; height: 22px; border-radius: 50%; display: inline-block; }

.cal { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; box-shadow: var(--sombra); }
.cal-sem { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--rosa-suave); border-bottom: 1px solid var(--linha); }
.cal-sem div { padding: 9px 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--rosa-escuro); }
.cal-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-dia {
  min-height: 118px; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.cal-dia:nth-child(7n) { border-right: 0; }
.cal-dia.fora { background: #fcfafb; }
.cal-dia.fora .cal-num { color: var(--linha-forte); }
.cal-dia.fds { background: #fdfbfc; }
.cal-num { font-weight: 800; font-size: 13px; color: var(--texto-2); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cal-dia.hoje .cal-num { background: var(--amarelo); color: #3b2b00; }
.cal-dia.feriado .cal-num { color: var(--rosa); }
.chip {
  display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--chip-cor, var(--rosa));
  background: var(--chip-fundo, var(--rosa-claro)); color: var(--texto); border-radius: 7px; padding: 4px 7px;
  font-size: 12px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.chip:hover { filter: brightness(.96); }
.cal .chip { max-height: calc(2.5em + 5px); padding-bottom: 1px; }
.chip.concluido { opacity: .55; text-decoration: line-through; }
.chip.planejado::before { content: "◔ "; color: #1d4ed8; }
.chip.concluido::before { content: "✓ "; color: var(--ok); text-decoration: none; }
.chip.chip-teste { border-left-style: dashed; background: #f3f4f6; letter-spacing: .2px; }
.cal-mais { font-size: 11.5px; color: var(--rosa); font-weight: 800; border: 0; background: none; text-align: left; padding: 0 4px; }

/* Agenda (celular) */
.agenda { display: none; }
.agenda-dia { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.agenda-dia:last-child { border-bottom: 0; }
.agenda-data { text-align: center; line-height: 1.05; }
.agenda-data b { display: block; font-family: var(--fonte-titulo); font-size: 26px; color: var(--rosa); }
.agenda-data small { font-size: 11px; font-weight: 800; color: var(--texto-2); text-transform: uppercase; }
.agenda-evs { display: grid; gap: 6px; }
.agenda-evs .chip { -webkit-line-clamp: 3; font-size: 13px; padding: 7px 9px; }

.resultado-busca { margin-bottom: 14px; }

/* ----------------------------- Modal ----------------------------- */
.modal-fundo {
  position: fixed; inset: 0; background: rgba(42, 20, 35, .45); z-index: 60; display: grid; place-items: center; padding: 16px;
  backdrop-filter: blur(2px);
}
.modal {
  background: #fff; border-radius: 20px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: var(--sombra-forte);
  animation: subir .18s ease-out;
}
@keyframes subir { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-cab { padding: 20px 22px 14px; border-bottom: 1px solid var(--linha); position: sticky; top: 0; background: #fff; z-index: 2; border-radius: 20px 20px 0 0; }
.modal-cab .faixa { height: 5px; border-radius: 5px; width: 64px; margin-bottom: 10px; background: var(--faixa, var(--rosa)); }
.modal-cab h2 { margin: 0 34px 8px 0; font-family: var(--fonte-titulo); font-size: 27px; line-height: 1.1; }
.modal-cab .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.modal-fechar { position: absolute; right: 14px; top: 14px; }
.modal-corpo { padding: 16px 22px; display: grid; gap: 14px; }
.modal-rodape { padding: 14px 22px 20px; border-top: 1px solid var(--linha); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: #fff; }
.modal-rodape .esq { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.det-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.det { background: var(--fundo); border-radius: 12px; padding: 10px 12px; }
.det.full { grid-column: 1 / -1; }
.det-rot { font-size: 11.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--texto-2); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
.det-val { font-size: 14.5px; }
.det-val a { color: var(--rosa-escuro); font-weight: 700; word-break: break-word; }
.aviso-fds { background: var(--amarelo-claro); color: #6b4f00; border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }
.aviso-conf { background: var(--alerta-claro); color: var(--alerta); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; }

.status-seg { display: inline-flex; background: var(--fundo); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.status-seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--texto-2); }
.status-seg button.ativo[data-status="pendente"] { background: #fff; color: var(--texto); box-shadow: var(--sombra); }
.status-seg button.ativo[data-status="planejado"] { background: #1d4ed8; color: #fff; }
.status-seg button.ativo[data-status="concluido"] { background: var(--ok); color: #fff; }

.lemb-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lemb-mini li { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.lemb-mini li b { min-width: 92px; font-size: 12.5px; color: var(--rosa-escuro); }
.lemb-mini li.passado { color: var(--texto-3); }
.lemb-mini li.passado b { color: var(--texto-3); }

/* Formulário */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
.form label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--texto-2); }
.form .dica { font-weight: 500; font-size: 12px; color: var(--texto-3); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; flex-direction: row; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); border-radius: 999px; padding: 5px 11px; font-weight: 600; color: var(--texto); cursor: pointer; font-size: 13px; }
.checks input { accent-color: var(--rosa); margin: 0; }
.checks label:has(input:checked) { background: var(--rosa-claro); border-color: var(--rosa); color: var(--rosa-escuro); }
.erro-form { color: var(--erro); font-size: 13px; font-weight: 700; }

/* ----------------------------- Testes ----------------------------- */
.testes { display: grid; gap: 10px; }
.teste {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--linha); background: #fff;
}
.teste-num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--fonte-titulo); font-weight: 800; font-size: 20px; background: var(--fundo); color: var(--texto-2); }
.teste.ok .teste-num { background: var(--ok-claro); color: var(--ok); }
.teste.falha .teste-num { background: var(--erro-claro); color: var(--erro); }
.teste.aguardando .teste-num { background: var(--alerta-claro); color: var(--alerta); }
.teste h3 { margin: 0; font-size: 15px; }
.teste p { margin: 2px 0 0; font-size: 13px; color: var(--texto-2); }
.teste-res { margin-top: 6px; font-size: 13px; font-weight: 700; }
.teste.ok .teste-res { color: var(--ok); }
.teste.falha .teste-res { color: var(--erro); }
.teste.aguardando .teste-res { color: var(--alerta); }
.teste-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.testes-grade { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.contagem { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 800; color: var(--rosa); }

/* ----------------------------- Toasts ----------------------------- */
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 80; width: min(380px, calc(100vw - 32px)); }
.toast {
  background: #2a2230; color: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: var(--sombra-forte); display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;
  animation: subir .2s ease-out; font-size: 14px;
}
.toast .ico { color: var(--amarelo); margin-top: 2px; }
.toast b { display: block; }
.toast button { background: none; border: 0; color: #fff; opacity: .7; padding: 0 2px; }
.toast.lembrete { background: linear-gradient(120deg, var(--rosa), var(--rosa-escuro)); }
.toast.ok .ico { color: #7ee2b5; }
.toast.erro { background: var(--erro); }

/* Página "sem eventos" etc. */
.aviso { background: var(--amarelo-claro); border-radius: 12px; padding: 12px 14px; }

/* ----------------------------- Responsivo ----------------------------- */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .ano { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .filtros { grid-template-columns: 1fr 1fr 1fr; }
  .filtros .campo-busca { grid-column: 1 / -1; }
}
@media (max-width: 980px) {
  .painel-grade, .testes-grade { grid-template-columns: 1fr; }
  .nav-btn span:not(.ico):not([data-icon]) { display: none; }
  .nav-btn .nav-badge { display: inline-grid; }
  .nav-btn { padding: 9px 11px; }
  .topo-acoes .btn-primario span:last-child { display: none; }
  .topo-acoes .btn-primario { width: 40px; height: 40px; padding: 0; }
}
@media (max-width: 720px) {
  body { font-size: 14.5px; }
  .topo-inner { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .marca-sol { width: 46px; }
  .marca-nome { font-size: 21px; }
  .marca-sub { font-size: 11px; }
  .nav { order: 3; width: 100%; justify-content: space-between; margin: 0; }
  .nav-btn { flex: 1; justify-content: center; }
  .topo-acoes { margin-left: auto; }
  .conteudo { padding: 14px 12px 32px; }
  .hero { grid-template-columns: 1fr; padding: 20px; }
  .hero h1 { font-size: 30px; }
  .hero-selo { display: none; }
  .hero::before { width: 220px; height: 220px; right: -90px; top: -90px; bottom: auto; opacity: .35; }
  .kpis { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-valor { font-size: 30px; }
  .ano { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .areas { grid-template-columns: 1fr; }
  .filtros { grid-template-columns: 1fr 1fr; }
  .mes-titulo { font-size: 26px; min-width: 0; flex: 1; }
  .cal { display: none; }
  .agenda { display: block; background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 4px 14px; }
  .det-grade, .form { grid-template-columns: 1fr; }
  .modal-fundo { padding: 0; align-items: end; }
  .modal { border-radius: 20px 20px 0 0; max-height: 92vh; }
  .teste { grid-template-columns: 34px 1fr; }
  .teste-num { width: 34px; height: 34px; font-size: 17px; }
  .teste-btns { grid-column: 1 / -1; justify-content: flex-start; }
  .lemb { grid-template-columns: auto 1fr; }
  .lemb-btns { grid-column: 1 / -1; justify-content: flex-end; }
  .item { grid-template-columns: 48px 1fr; }
  .item-dir { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
  .rodape { flex-direction: column; text-align: center; }
}
@media (max-width: 380px) {
  .ano { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
}

@media print {
  .topo, .rodape, .toasts, .hero-acoes, .filtros { display: none !important; }
  body { background: #fff; }
}

/* ===================== Pessoas ===================== */
.pes-topo { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.pes-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis.kpis-4 { grid-template-columns: repeat(4, 1fr); }
.pes-meses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pes-mes { border: 1px solid var(--linha); border-radius: 14px; padding: 10px; background: #fff; min-height: 90px; }
.pes-mes-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; border-bottom: 2px solid var(--rosa-claro); padding-bottom: 4px; }
.pes-mes-cab button { border: 0; background: none; font-family: var(--fonte-titulo); font-weight: 700; font-size: 17px; color: var(--texto); padding: 0; cursor: pointer; }
.pes-mes-cab button:hover { color: var(--rosa); }
.pes-mes-cab em { font-style: normal; font-size: 11.5px; font-weight: 800; color: #be123c; background: #ffe4e9; border-radius: 999px; padding: 1px 8px; }
.pes-nada { color: var(--texto-3); font-size: 13px; padding: 4px 2px; }
.pes-ev { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 4px 4px; border-radius: 8px; font-size: 13px; color: var(--texto); line-height: 1.25; cursor: pointer; }
.pes-ev:hover { background: var(--rosa-suave); }
.pes-ev .pes-dia { font-weight: 800; color: #be123c; min-width: 20px; font-variant-numeric: tabular-nums; }
.pes-ev .tag { font-size: 10.5px; padding: 1px 6px; }
.pes-lista-mini { display: grid; gap: 2px; }
.pes-qtd { font-family: var(--fonte); font-size: 12px; font-weight: 800; color: #be123c; background: #ffe4e9; border-radius: 999px; padding: 2px 9px; }
.pes-lista { display: grid; gap: 6px; max-height: 520px; overflow: auto; }
.pes-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--linha); border-radius: 12px; background: #fff; }
.pes-item.inativo { opacity: .6; }
.pes-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, var(--rosa), #ff7ab8); color: #fff; font-weight: 800; font-size: 13px; text-transform: uppercase; }
.pes-info { display: grid; min-width: 0; flex: 1; }
.pes-info b { font-size: 14px; }
.pes-info small { font-size: 12px; color: var(--texto-2); }
.pes-cfg { display: grid; gap: 8px; }
.pes-check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.pes-check input { accent-color: var(--rosa); width: 18px; height: 18px; margin-top: 2px; flex: none; }
.pes-check span { display: grid; gap: 2px; }
.pes-check b { font-size: 14px; color: var(--texto); }
.pes-check small { font-size: 12.5px; color: var(--texto-2); font-weight: 500; }
.pes-dm { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.form-rot { font-size: 13px; font-weight: 700; color: var(--texto-2); margin-bottom: 5px; }
.aviso-pessoa { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #ffe4e9; color: #881337; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
.aviso-pessoa .ico { color: #be123c; }
.busca { display: flex; align-items: center; gap: 8px; position: relative; }
.busca .ico { position: absolute; left: 12px; color: var(--texto-3); }
.busca .input { padding-left: 36px; width: 100%; }
@media (max-width: 980px) { .pes-meses { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis.kpis-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .pes-meses { grid-template-columns: 1fr; } }

/* ===================== Vínculo CLT / PJ ===================== */
.vb { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .4px; line-height: 1; padding: 3px 6px; border-radius: 6px; vertical-align: 1px; }
.vb-clt { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
.vb-pj { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.vb-nd { background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; }
.vb-alerta { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.pes-alerta { display: block; font-style: normal; color: #b91c1c; font-weight: 700; margin-top: 2px; }
.aviso-vinc { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 10px; }
.aviso-vinc b { flex: none; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; color: #fff; }
.vinc-clt { background: #f0fdf4; color: #14532d; } .vinc-clt b { background: #16a34a; }
.vinc-pj { background: #fffbeb; color: #78350f; } .vinc-pj b { background: #d97706; }
.vinc-nd { background: #f3f4f6; color: #374151; } .vinc-nd b { background: #9ca3af; }
.vinc-alerta { background: #fef2f2; color: #7f1d1d; } .vinc-alerta b { background: #dc2626; }
.pes-seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.pes-seg button { border: 1px solid var(--linha); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--texto-2); cursor: pointer; }
.pes-seg button em { font-style: normal; font-weight: 800; color: var(--texto-3); margin-left: 2px; }
.pes-seg button.ativo { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.pes-seg button.ativo em { color: #ffe3f1; }
.pes-ev .vb { font-size: 9.5px; padding: 2px 4px; margin-left: 2px; }
.chip .vb { font-size: 9px; padding: 1px 4px; vertical-align: 1px; }

</style>

  function dispararLembrete(l) {
    var titulo = "🔔 " + l.acao;
    var corpo = l.ev.titulo + " — " + fmtData(l.ev.data) + " (" + l.etapa + ")";
    var sistema = notificarSistema(titulo, corpo, l.key, function () { abrirEvento(l.ev.id); });
    toast(corpo, "lembrete", {
      titulo: titulo, duracao: 12000,
      acao: { rotulo: "Abrir", fn: function () { abrirEvento(l.ev.id); } },
      nota: sistema ? "Notificação do sistema enviada." : (estadoNotif() === "granted" ? "Falha na notificação do sistema: " + ultimoErroNotif : "Notificações do sistema não autorizadas — aviso exibido só aqui.")
    });
  }
  function verificarLembretes() {
    var agora = new Date();
    var mudou = false;
    todosLembretes().forEach(function (l) {
      if (l.feito || estado.notificados[l.key]) return;
      // dispara lembretes vencidos nas últimas 24h (os mais antigos aparecem como "atrasados" na central)
      if (l.quando <= agora && agora - l.quando < 864e5) {
        estado.notificados[l.key] = agora.toISOString();
        mudou = true;
        dispararLembrete(l);
      }
    });
    if (mudou) { salvar(); if (ui.view === "lembretes" || ui.view === "painel" || ui.view === "testes") render(); }
    atualizarBadge();
  }

  /* ------------------------------------------------------------------ *
   * Exportação .ics (RFC 5545)
   * ------------------------------------------------------------------ */
  function icsEsc(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
  function icsData(s) { return s.replace(/-/g, ""); }
  function icsUTC(d) { return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z"; }
  function dobrar(linha) { // quebra linhas com mais de 75 octetos
    var enc = new TextEncoder();
    if (enc.encode(linha).length <= 75) return linha;
    var partes = [], atual = "", bytes = 0, limite = 75;
    for (var i = 0; i < linha.length; i++) {
      var ch = linha[i];
      var code = linha.charCodeAt(i);
      if (code >= 0xd800 && code <= 0xdbff && i + 1 < linha.length) { ch += linha[++i]; }
      var b = enc.encode(ch).length;
      if (bytes + b > limite) { partes.push(atual); atual = " " + ch; bytes = 1 + b; limite = 75; }
      else { atual += ch; bytes += b; }
    }
    partes.push(atual);
    return partes.join("\r\n");
  }
  function descricaoICS(ev) {
    var t = [];
    t.push("Categoria: " + nomeCat(ev.categoria) + " · Tipo: " + (TIPOS[ev.tipo] || ev.tipo) + " · Prioridade: " + PRIO[ev.prioridade]);
    if (ev.publico.length) t.push("Público: " + ev.publico.join(", "));
    if (ev.contexto) t.push("Contexto: " + ev.contexto);
    if (ev.sugestao) t.push("Sugestão de ação: " + ev.sugestao);
    if (ev.antecedencia) t.push("Antecedência recomendada: " + ev.antecedencia);
    if (ev.fonte) t.push("Fonte: " + ev.fonte + (ev.fonteUrl ? " — " + ev.fonteUrl : ""));
    if (ev.observacoes) t.push("Observações: " + ev.observacoes);
    t.push("Status: " + STATUS[ev.status]);
    t.push("Lembretes: " + lembretesDe(ev).map(function (l) { return l.etapa + " (" + fmtDataHora(l.quando) + "): " + l.acao; }).join(" | "));
    return t.join("\n");
  }
  function gerarICS(eventos, opcoes) {
    opcoes = opcoes || {};
    var lembretesComoEventos = opcoes.lembretesComoEventos !== false;
    var agora = icsUTC(new Date());
    var L = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Catarinnas Energia Solar//Catarinnas Conecta 2027//PT-BR",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:" + icsEsc("Catarinna’s Conecta — Endomarketing"), "X-WR-TIMEZONE:America/Sao_Paulo"
    ];
    ordenados(eventos).forEach(function (ev) {
      var lems = lembretesDe(ev);
      L.push("BEGIN:VEVENT");
      L.push("UID:" + ev.id + "@catarinnas-conecta");
      L.push("DTSTAMP:" + agora);
      L.push("DTSTART;VALUE=DATE:" + icsData(ev.data));
      L.push("DTEND;VALUE=DATE:" + icsData(iso(addDias(pd(fimDe(ev)), 1))));
      L.push("SUMMARY:" + icsEsc(ev.titulo));
      L.push("DESCRIPTION:" + icsEsc(descricaoICS(ev)));
      L.push("CATEGORIES:" + icsEsc(nomeCat(ev.categoria)));
      if (ev.fonteUrl) L.push("URL:" + ev.fonteUrl);
      L.push("TRANSP:TRANSPARENT");
      L.push("STATUS:" + (ev.confirmada === false ? "TENTATIVE" : "CONFIRMED"));
      lems.forEach(function (l) {
        L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(l.acao + " — " + ev.titulo), "TRIGGER;VALUE=DATE-TIME:" + icsUTC(l.quando), "END:VALARM");
      });
      L.push("END:VEVENT");
      if (lembretesComoEventos) {
        lems.forEach(function (l, i) {
          var fim = new Date(l.quando.getTime() + 30 * 60000);
          L.push("BEGIN:VEVENT");
          L.push("UID:" + ev.id + "-lembrete-" + (l.dias || "c" + i) + "@catarinnas-conecta");
          L.push("DTSTAMP:" + agora);
          L.push("DTSTART:" + icsUTC(l.quando));
          L.push("DTEND:" + icsUTC(fim));
          L.push("SUMMARY:" + icsEsc("🔔 " + l.acao + " — " + ev.titulo));
          L.push("DESCRIPTION:" + icsEsc("Lembrete (" + l.etapa + ") do evento \"" + ev.titulo + "\" em " + fmtData(ev.data) + ".\nProvidência: " + l.acao + (ev.sugestao ? "\nSugestão: " + ev.sugestao : "")));
          L.push("CATEGORIES:" + icsEsc("Lembrete Endomarketing"));
          L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(l.acao), "TRIGGER:PT0M", "END:VALARM");
          L.push("END:VEVENT");
        });
      }
    });

  function baixar(nome, conteudo, tipo) {

    a.href = url; a.download = nome; a.style.display = "none";
    document.body.appendChild(a); a.click();

    var icone = tipo === "lembrete" ? "bell" : tipo === "ok" ? "check" : tipo === "erro" ? "info" : "sun";
    el.innerHTML = ic(icone) + '<div>' + (op.titulo ? "<b>" + esc(op.titulo) + "</b>" : "") + esc(msg) +
      (op.nota ? '<div style="opacity:.75;font-size:12px;margin-top:3px">' + esc(op.nota) + "</div>" : "") +
      (op.acao ? '<div style="margin-top:8px"><button class="btn btn-p" style="background:#fff;color:#b80f69;opacity:1">' + esc(op.acao.rotulo) + "</button></div>" : "") +
      '</div><button aria-label="Fechar">' + ic("x") + "</button>";
    caixa.appendChild(el);
    var fechar = function () { el.remove(); };
    el.querySelector('button[aria-label="Fechar"]').onclick = fechar;
    if (op.acao) el.querySelector(".btn").onclick = function () { op.acao.fn(); fechar(); };
    setTimeout(fechar, op.duracao || 4500);
  }

  /* ------------------------------------------------------------------ *
   * Modal
   * ------------------------------------------------------------------ */
  var modalAoFechar = null;
  function abrirModal(html, aoFechar) {
    var fundo = $("#modalFundo"), m = $("#modal");
    m.innerHTML = html;
    fundo.hidden = false;
    document.body.style.overflow = "hidden";
    modalAoFechar = aoFechar || null;
    var foco = m.querySelector("[autofocus]") || m.querySelector(".modal-fechar");
    if (foco) setTimeout(function () { foco.focus(); }, 30);
    $$("[data-fechar]", m).forEach(function (b) { b.onclick = fecharModal; });
  }
  function fecharModal() {
    var fundo = $("#modalFundo");
    if (fundo.hidden) return;
    fundo.hidden = true;
    $("#modal").innerHTML = "";
    document.body.style.overflow = "";
    var cb = modalAoFechar; modalAoFechar = null;
    if (cb) cb();
  }
  function modalAberto() { return !$("#modalFundo").hidden; }
  function confirmar(titulo, texto, rotuloOk, perigo) {
    return new Promise(function (resolve) {
      var fundo = document.createElement("div");
      fundo.className = "modal-fundo"; fundo.style.zIndex = 75;
      fundo.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" style="width:min(460px,100%)">' +
        '<div class="modal-corpo" style="padding-top:22px"><h2 style="margin:0;font-family:var(--fonte-titulo);font-size:24px">' + esc(titulo) + '</h2><p style="margin:0;color:var(--texto-2)">' + esc(texto) + "</p></div>" +
        '<div class="modal-rodape"><button class="btn" data-r="0">Cancelar</button><button class="btn ' + (perigo ? "btn-perigo" : "btn-primario") + '" data-r="1">' + esc(rotuloOk || "Confirmar") + "</button></div></div>";
      document.body.appendChild(fundo);
      var fim = function (v) { fundo.remove(); document.removeEventListener("keydown", tecla, true); resolve(v); };
      var tecla = function (e) { if (e.key === "Escape") { e.stopPropagation(); fim(false); } };
      document.addEventListener("keydown", tecla, true);
      fundo.querySelector('[data-r="0"]').onclick = function () { fim(false); };
      fundo.querySelector('[data-r="1"]').onclick = function () { fim(true); };
      fundo.onclick = function (e) { if (e.target === fundo) fim(false); };
      fundo.querySelector('[data-r="1"]').focus();
    });
  }

  var ui = {
    view: "painel",
    ano: ANO_BASE,
    mesAno: ANO_BASE,
    mes: 0,
    filtros: { q: "", cat: "", pub: "", prio: "", status: "" },
    lembFiltro: "todos",
    lembMostrarTodos: false
  };
  (function mesInicial() {
    var h = new Date();
    if (h.getFullYear() === ANO_BASE) { ui.mes = h.getMonth(); }
    else if (h.getFullYear() === ANO_BASE - 1) { ui.mesAno = ANO_BASE - 1; ui.mes = h.getMonth(); }
  })();

  function irPara(view, extra) {
    var hash = "#/" + view;
    if (view === "mes") hash += "/" + (extra || (ui.mesAno + "-" + pad(ui.mes + 1)));
    if (location.hash === hash) render(); else location.hash = hash;
  }
  function lerRota() {
    var h = (location.hash || "").replace(/^#\/?/, "").split("/");
    var v = h[0] || "painel";
    if (["painel", "mes", "lembretes", "pessoas", "testes"].indexOf(v) === -1) v = "painel";
    ui.view = v;
    if (v === "mes" && h[1] && /^\d{4}-\d{2}$/.test(h[1])) {
      var p = h[1].split("-").map(Number);
      if (p[1] >= 1 && p[1] <= 12) { ui.mesAno = p[0]; ui.mes = p[1] - 1; }
    }
  }
  function abrirMes(ano, mes) {
    var d = new Date(ano, mes, 1);
    ui.mesAno = d.getFullYear(); ui.mes = d.getMonth();
    irPara("mes", ui.mesAno + "-" + pad(ui.mes + 1));
  }

  function linhaLembrete(l, compacto) {

  function kpi(rotulo, valor, det, icone, cor, filtro) {
    var tag = filtro ? "button" : "div";

    return "<" + tag + ' class="kpi"' + attr + ' style="--kpi-cor:' + cor + '"><span class="kpi-rotulo">' + ic(icone) + " " + rotulo + '</span><span class="kpi-valor">' + valor + '</span><span class="kpi-det">' + det + "</span></" + tag + ">";
  }
  function rotuloNotif() {
    var e = estadoNotif();
    if (e === "granted") return '<span class="notif-estado ok">autorizadas</span>';
    if (e === "denied") return '<span class="notif-estado neg">bloqueadas</span> (libere nas configurações do site)';
    if (e === "indisponivel") return '<span class="notif-estado neg">não suportadas neste navegador</span>';
    return '<span class="notif-estado pend">ainda não autorizadas</span> — <button class="btn btn-p btn-texto" data-acao="pedir-permissao" style="padding:2px 6px">autorizar</button>';
  }

  function renderAnoHTML() {
    var ano = ui.ano;
    var hoje = hojeISO();
    var evs = estado.eventos;
    var html = '<div class="ano-topo"><h2>' + ic("calendar").replace('class="ico"', 'class="ico" style="color:var(--rosa);width:22px;height:22px"') + " Calendário anual " + ano + "</h2>" +
      '<div class="ano-nav"><button class="btn btn-icone btn-texto" data-ano="' + (ano - 1) + '" aria-label="Ano anterior">' + ic("chevL") + "</button>" +
      (ano !== ANO_BASE ? '<button class="btn btn-p" data-ano="' + ANO_BASE + '">' + ANO_BASE + "</button>" : "") +
      '<button class="btn btn-icone btn-texto" data-ano="' + (ano + 1) + '" aria-label="Próximo ano">' + ic("chevR") + "</button></div></div>";
    html += '<div class="legenda">' + Object.keys(CAT).map(function (k) { return '<span><i style="background:' + CAT[k].cor + '"></i>' + esc(CAT[k].nome) + "</span>"; }).join("") + "</div>";
    html += '<div class="ano">';
    for (var m = 0; m < 12; m++) {
      var ini = new Date(ano, m, 1), dias = new Date(ano, m + 1, 0).getDate();
      var pref = ano + "-" + pad(m + 1);
      var doMes = evs.filter(function (e) { return e.data.slice(0, 7) <= pref && fimDe(e).slice(0, 7) >= pref; });
      var periodos = doMes.filter(ehPeriodo);
      html += '<button class="mini" data-abrir-mes="' + ano + "-" + m + '" aria-label="Abrir ' + MESES[m] + " de " + ano + ", " + doMes.length + ' eventos">' +
        '<div class="mini-cab"><span class="mini-nome">' + MESES[m] + "</span>" + (doMes.length ? '<span class="mini-qtd">' + doMes.length + "</span>" : "") + "</div>" +
        '<div class="mini-camp">' + periodos.map(function (e) { return '<i title="' + esc(e.titulo) + '" style="background:' + corCat(e.categoria) + '"></i>'; }).join("") + "</div>" +
        '<div class="mini-grade">' + DIAS.map(function (d) { return "<b>" + d[0] + "</b>"; }).join("");
      for (var v = 0; v < ini.getDay(); v++) html += "<span></span>";
      for (var d = 1; d <= dias; d++) {
        var di = pref + "-" + pad(d);
        var dw = new Date(ano, m, d).getDay();
        var doDia = evs.filter(function (e) { return !ehPeriodo(e) && e.data === di; });
        var cats = [];
        doDia.forEach(function (e) { if (cats.indexOf(e.categoria) === -1) cats.push(e.categoria); });
        html += '<span class="mini-dia' + (dw === 0 || dw === 6 ? " fds" : "") + (doDia.length ? " tem" : "") + (di === hoje ? " hoje" : "") + '"' + (doDia.length ? ' title="' + esc(doDia.map(function (e) { return e.titulo; }).join(" · ")) + '"' : "") + ">" + d +
          (cats.length ? '<span class="pts">' + cats.slice(0, 3).map(function (c) { return '<i style="background:' + corCat(c) + '"></i>'; }).join("") + "</span>" : "") + "</span>";
      }
      html += "</div></button>";
    }
    html += "</div>";
    return html;
  }

  /* ------------------------------------------------------------------ *

  /* ------------------------------------------------------------------ *

  var AREAS = PUBLICOS.filter(function (p) { return ["Todos os colaboradores", "Mulheres", "Homens", "Mães", "Pais", "Famílias"].indexOf(p) === -1; });

  function prepararPessoas(d) {
    if (!Array.isArray(d.colaboradores)) d.colaboradores = [];
    var cfg = d.pessoasConfig || {};
    d.pessoasConfig = {
      aniversarios: cfg.aniversarios !== false,
      tempoCasa: cfg.tempoCasa !== false,

  function colabBase(c) {
    return {
      id: c.id || uid("pes"), nome: String(c.nome || "").trim(), area: String(c.area || "").trim(), gestor: String(c.gestor || "").trim(),
      aniversario: c.aniversario || "", admissao: c.admissao || "", ativo: c.ativo !== false,

  // "MM-DD" válido?
  function mmddValido(s) {
    if (!/^\d{2}-\d{2}$/.test(s || "")) return false;

    return p[0] >= 1 && p[0] <= 12 && p[1] >= 1 && p[1] <= new Date(2024, p[0], 0).getDate(); // 2024: aceita 29/02
  }
  function fmtMMDD(s) { return mmddValido(s) ? s.slice(3) + "/" + s.slice(0, 2) : "—"; }
  // Data no ano-base; 29/02 vira 28/02 em anos não bissextos
  function dataNoAno(mmdd, ano) {
    var m = Number(mmdd.slice(0, 2)), d = Number(mmdd.slice(3));

  }
  function publicoDaArea(area) {
    var n = norm(area);

    for (var j = 0; j < AREAS.length; j++) {

      if (partes.some(function (pp) { return n.indexOf(pp) > -1 || pp.indexOf(n) > -1; })) return [AREAS[j]];

    return ["Todos os colaboradores"];

  function primeiroNome(nome) { return String(nome).trim().split(/\s+/)[0] || nome; }

  // Lista dos eventos que o cadastro deve gerar

  var INICIO_COBERTURA = (ANO_BASE - 1) + "-11-01";
  function eventosDesejados() {
    var cfg = estado.pessoasConfig, lista = [];

    var janelas = [{ ano: ANO_BASE - 1, sufixo: "-" + (ANO_BASE - 1) }, { ano: ANO_BASE, sufixo: "" }];

      var quemAssina = c.gestor ? "pelo gestor " + c.gestor : "pela liderança";

      janelas.forEach(function (jn) {

              (c.aniversario === "02-29" && dAniv.slice(5) === "02-28" ? ". Nascido(a) em 29/02: em " + ano + " a data foi ajustada para 28/02." : ".") +
              infoV + " Gerado automaticamente a partir do cadastro de Pessoas.",
            sugestao: "Mensagem ou cartão assinado " + quemAssina + " e parabéns no canal interno (somente se " + primeiroNome(c.nome) + " autorizar a divulgação). Incluir na comemoração mensal dos aniversariantes."
          }));
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(c.admissao)) {

          if (cfg.tempoCasa && anos >= 1 && dCasa >= INICIO_COBERTURA) {

            lista.push(Object.assign({}, comum, {
              id: "pessoa-casa-" + c.id + jn.sufixo, pessoaTipo: "tempo-casa",
              titulo: c.nome + sufV + " — " + anos + (anos > 1 ? " anos" : " ano") + " de Catarinna’s",
              data: dCasa, prioridade: marco ? "alta" : "baixa", antecedencia: marco ? "30 dias" : "7 dias",
              contexto: "Aniversário de empresa de " + c.nome + rotArea + ": admissão em " + fmtData(c.admissao) + ". " + (marco ? "Marco de carreira (" + anos + (anos > 1 ? " anos" : " ano") + ")." : "") + infoV + " Gerado automaticamente a partir do cadastro de Pessoas.",
              sugestao: marco ? "Reconhecimento especial: certificado ou lembrança comemorativa, mensagem da diretoria e menção na reunião geral, com a história de " + primeiroNome(c.nome) + " na empresa." :
                "Mensagem de agradecimento " + (c.gestor ? "do gestor " + c.gestor : "do gestor direto") + " e menção no canal interno."
            }));

        lista.push(Object.assign({}, comum, {
          id: "pessoa-integra-" + c.id, pessoaTipo: "boas-vindas", titulo: "Boas-vindas — " + c.nome + sufV + " · integração",
          data: c.admissao, prioridade: "media", antecedencia: "15 dias",
          contexto: "Admissão de " + c.nome + rotArea + " em " + fmtData(c.admissao) + "." + infoV + " Gerado automaticamente a partir do cadastro de Pessoas.",
          sugestao: "Kit de boas-vindas, apresentação à equipe, padrinho/madrinha na área, agenda de integração da primeira semana e post de boas-vindas no canal interno."
        }));

  }
  // Cria, atualiza e remove os eventos gerados. Preserva status, observações, prioridade e sugestão editadas.
  function sincronizarPessoas() {
    if (!estado || !estado.colaboradores) return false;
    var desejados = eventosDesejados(), mapa = {}, mudou = false;
    desejados.forEach(function (d) { mapa[d.id] = d; });
    estado.eventos = estado.eventos.filter(function (e) {
      if (e.pessoaId && !mapa[e.id]) { limparLembretes(e.id); mudou = true; return false; }
      return true;
    });
    desejados.forEach(function (d) {
      var ev = porId(d.id);
      if (!ev) { var novo = eventoBase(d); novo.lembretesDesde = hojeISO(); estado.eventos.push(novo); mudou = true; return; }
      var fixos = ["titulo", "data", "publico", "categoria", "tipo", "contexto", "fonte", "pessoaId", "pessoaTipo", "antecedencia", "vinculo"];
      if (ev.data !== d.data) limparLembretes(ev.id);
      fixos.forEach(function (k) {
        if (JSON.stringify(ev[k]) !== JSON.stringify(d[k])) { ev[k] = clonar(d[k]); mudou = true; }
      });
      if (ev.dataFim) { ev.dataFim = ""; mudou = true; }
    });
    return mudou;
  }
  function validarColab(c) {
    var erros = [];
    if (!c.nome) erros.push("Informe o nome.");
    if (c.aniversario && !mmddValido(c.aniversario)) erros.push("Aniversário inválido (use dia e mês).");
    if (c.admissao && !(/^\d{4}-\d{2}-\d{2}$/.test(c.admissao) && dataValida(c.admissao))) erros.push("Data de admissão inválida.");
    if (c.admissao && dataValida(c.admissao) && Number(c.admissao.slice(0, 4)) > ANO_BASE) erros.push("A admissão não pode ser posterior a " + ANO_BASE + ".");
    if (!c.aniversario && !c.admissao) erros.push("Informe o aniversário ou a data de admissão.");
    return erros;
  }
  function salvarColab(dados, id) {
    var c = colabBase(Object.assign({}, id ? colabPorId(id) : {}, dados, id ? { id: id } : {}));
    var erros = validarColab(c);
    if (erros.length) throw new Error(erros.join(" "));
    if (id) { var i = estado.colaboradores.findIndex(function (x) { return x.id === id; }); estado.colaboradores[i] = c; }
    else estado.colaboradores.push(c);

    return c;
  }
  function excluirColab(id) {

    sincronizarPessoas(); salvar();
  }
  function colabPorId(id) { for (var i = 0; i < estado.colaboradores.length; i++) if (estado.colaboradores[i].id === id) return estado.colaboradores[i]; return null; }

  // Importação: uma pessoa por linha — Nome ; Área ; Aniversário (dd/mm) ; Admissão (dd/mm/aaaa)
  function lerDataBR(s, comAno) {
    s = String(s || "").trim();
    if (!s) return "";
    var m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
    var iso_ = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (iso_) return comAno ? s : iso_[2] + "-" + iso_[3];
    if (!m) return null;
    var dd = pad(Number(m[1])), mm = pad(Number(m[2]));
    if (!comAno) return mm + "-" + dd;
    if (!m[3]) return null;
    var aa = Number(m[3]); if (aa < 100) aa += aa > 50 ? 1900 : 2000;
    return aa + "-" + mm + "-" + dd;
  }
  function importarTexto(texto) {
    var linhas = String(texto || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var novos = [], erros = [], atualizados = 0;
    linhas.forEach(function (l, i) {
      var cols = l.indexOf("\t") > -1 ? l.split("\t") : l.indexOf(";") > -1 ? l.split(";") : l.split(",");
      cols = cols.map(function (c) { return c.trim().replace(/^"|"$/g, ""); });
      if (i === 0 && /nome/i.test(cols[0])) return; // cabeçalho
      var c = { nome: cols[0], area: cols[1] || "", aniversario: lerDataBR(cols[2], false), admissao: lerDataBR(cols[3], true) };
      if (cols[4]) c.gestor = cols[4];
      if (cols[5]) { var vv = cols[5].toUpperCase().replace(/[^A-Z]/g, ""); if (vv === "CLT" || vv === "PJ") c.vinculo = vv; }
      if (cols[6]) c.cargo = cols[6];
      if (c.aniversario === null || c.admissao === null) { erros.push("Linha " + (i + 1) + " (" + (cols[0] || "?") + "): data em formato não reconhecido"); return; }
      // aniversário com ano completo (dd/mm/aaaa) é aceito, mas só dia e mês são guardados
      var e = validarColab(colabBase(c));
      if (e.length) { erros.push("Linha " + (i + 1) + " (" + (cols[0] || "?") + "): " + e.join(" ")); return; }
      novos.push(c);
    });
    novos.forEach(function (c) {
      var existente = estado.colaboradores.filter(function (x) { return norm(x.nome) === norm(c.nome); })[0];
      if (existente) { Object.assign(existente, colabBase(Object.assign({}, existente, c, { id: existente.id }))); atualizados++; }
      else estado.colaboradores.push(colabBase(c));
    });

    return { incluidos: novos.length - atualizados, atualizados: atualizados, erros: erros };
  }
  function exportarCSV() {

    });

  function eventosPessoasDoMes(mes, ano) {

  function iconePessoa(t) { return t === "aniversario" ? "🎂" : t === "tempo-casa" ? "🏅" : "👋"; }

  function renderPessoas() {
    var cs = estado.colaboradores.slice().sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); });
    var ativos = cs.filter(function (c) { return c.ativo; }).length;

        var enviar = function () {
          var ok = notificarSistema("🔔 Teste — Catarinna’s Conecta", "Se você está vendo isto, as notificações do navegador estão funcionando.", "teste-manual");
          toast(ok ? "Notificação do sistema enviada." : "O navegador não exibiu a notificação" + (ultimoErroNotif ? ": " + ultimoErroNotif : " (permissão: " + estadoNotif() + ")") + ".", ok ? "ok" : "erro");
          renderConteudo();
        };
        if (estadoNotif() === "default") pedirPermissao().then(enviar); else enviar();
        break;
      case "gerar-demo": gerarDemo(); renderConteudo(); break;
      case "remover-demos":
        confirmar("Remover demonstrações?", "Os eventos de demonstração serão excluídos. As demais datas não são afetadas.", "Remover", true).then(function (ok) { if (ok) { removerDemos(); renderConteudo(); toast("Demonstrações removidas.", "ok"); } });
        break;
      case "recriar-teste":
        var orig = SEED.filter(function (e) { return e.id === "teste-calendario"; })[0];
        if (orig && !porId("teste-calendario")) { estado.eventos.push(eventoBase(orig)); salvar(); renderConteudo(); toast("Evento de teste recriado.", "ok"); }
        break;
      case "backup":
        baixar("catarinnas-conecta-backup-" + hojeISO() + ".json", JSON.stringify(estado, null, 2), "application/json");
        toast("Backup baixado. Guarde o arquivo em local seguro.", "ok");
        break;
      case "restaurar-original":
        confirmar("Restaurar calendário original?", "Todos os eventos, status, observações e lembretes voltarão ao estado inicial (o cadastro de Pessoas é mantido). Recomendamos baixar um backup antes.", "Restaurar", true).then(function (ok) {
          if (!ok) return;
          var pes = estado.colaboradores, cfgp = estado.pessoasConfig;
          estado = estadoInicial(); estado.colaboradores = pes; estado.pessoasConfig = cfgp; sincronizarPessoas();
          salvar(); render(); toast("Calendário original restaurado. O cadastro de Pessoas foi mantido.", "ok");
        });
        break;
    }
  }

  // Menu "mais"
  $("#btnMenu").addEventListener("click", function () {
    var m = $("#menuMais"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden));
  });
  $("#btnNovoEvento").addEventListener("click", function () {
    var dataPadrao = ui.view === "mes" ? (ui.mesAno + "-" + pad(ui.mes + 1) + "-01") : (new Date().getFullYear() >= ANO_BASE ? hojeISO() : ANO_BASE + "-01-01");
    abrirFormulario(null, dataPadrao);
  });
  $("#inputBackup").addEventListener("change", function () {
    var arq = this.files && this.files[0];
    this.value = "";
    if (!arq) return;
    $("#menuMais").hidden = true;
    var leitor = new FileReader();
    leitor.onload = function () {
      try {
        var d = JSON.parse(leitor.result);
        if (!d || !Array.isArray(d.eventos)) throw new Error("arquivo sem lista de eventos");
        confirmar("Restaurar backup?", "O backup contém " + d.eventos.length + " eventos e substituirá os dados atuais deste navegador.", "Restaurar").then(function (ok) {
          if (!ok) return;
          d.eventos = d.eventos.map(eventoBase);
          d.lembretesFeitos = d.lembretesFeitos || {}; d.notificados = d.notificados || {}; d.resultadosTestes = d.resultadosTestes || {};
          prepararPessoas(d); estado = d; sincronizarPessoas(); salvar(); render(); toast("Backup restaurado.", "ok");
        });
      } catch (err) { toast("Arquivo de backup inválido: " + err.message, "erro"); }
    };
    leitor.readAsText(arq);
  });

  // Pessoas: busca na lista e opções de geração
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "pesBusca") {
      ui.pesBusca = e.target.value;
      var l = $("#pesLista"); if (l) l.innerHTML = listaColabHTML(estado.colaboradores.slice().sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); }), ui.pesBusca);
    }
  });
  document.addEventListener("change", function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute("data-pcfg");
    if (!k) return;
    estado.pessoasConfig[k] = e.target.checked;
    sincronizarPessoas(); salvar(); renderConteudo(); atualizarBadge();
    toast("Calendário atualizado.", "ok");
  });

  // Teclado / fundo do modal
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (modalAberto()) fecharModal();
      var m = $("#menuMais"); if (!m.hidden) m.hidden = true;
    }
  });
  $("#modalFundo").addEventListener("mousedown", function (e) { if (e.target === this) fecharModal(); });

  // Sincroniza se outra aba alterar os dados
  window.addEventListener("storage", function (e) {
    if (e.key === CHAVE && e.newValue) { try { estado = JSON.parse(e.newValue); estado.eventos = estado.eventos.map(eventoBase); if (!modalAberto()) render(); } catch (err) { /* */ } }
  });
  window.addEventListener("hashchange", function () { if (modalAberto()) fecharModal(); render(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) verificarLembretes(); });

  /* ------------------------------------------------------------------ *
   * Inicialização
   * ------------------------------------------------------------------ */
  if (sincronizarPessoas()) salvar();
  preencherIcones(document);
  verificarReloadPersistencia();
  render();
  setTimeout(verificarLembretes, 1200);
  setInterval(verificarLembretes, 10000);

  // API mínima para depuração/automação (não necessária para o uso normal)
  window.CatarinnasConecta = {
    estado: function () { return estado; }, gerarICS: gerarICS, lembretesDe: lembretesDe, todosLembretes: todosLembretes,
    filtrarEventos: filtrarEventos, criarEvento: criarEvento, atualizarEvento: atualizarEvento, excluirEvento: excluirEvento,
    executarTeste: executarTeste, verificarLembretes: verificarLembretes
  };
})();

</script>
</body>
</html>
